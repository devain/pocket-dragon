<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#24204f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Pocket Dragon: a tiny one-tap arcade game about a baby dragon.">
  <title>Pocket Dragon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='24' fill='%233cc7a0' stroke='%232b1d3a' stroke-width='4'/%3E%3Cellipse cx='38' cy='30' rx='8' ry='10' fill='%23fff' stroke='%232b1d3a' stroke-width='3'/%3E%3Ccircle cx='40' cy='31' r='5' fill='%233a2766'/%3E%3Cpath d='M18 14 L24 4 L28 14Z' fill='%23ffd774' stroke='%232b1d3a' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game" data-state="title">
    <canvas id="canvas" aria-label="Pocket Dragon game"></canvas>

    <div id="hud">
      <button id="btn-pause" class="icon-btn" aria-label="Pause" title="Pause (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
      </button>
      <button id="btn-sound" class="icon-btn" aria-label="Mute sound" title="Mute (M)">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section id="screen-title" class="screen">
      <h1 class="logo" aria-label="Pocket Dragon">
        <span class="logo-small" data-text="Pocket">Pocket</span>
        <span class="logo-big" data-text="Dragon">Dragon</span>
      </h1>
      <div class="title-bottom">
        <div class="tap-hint">Tap to Start</div>
        <div class="title-best">Best <b id="title-best">0</b></div>
        <div class="controls-hint">Space · Click · Tap to flap</div>
      </div>
    </section>

    <section id="screen-ready" class="screen">
      <div class="ready-box">
        <div id="ready-text" class="ready-text">Get Ready!</div>
        <div class="tap-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48"><circle class="ring" cx="20" cy="14" r="9"/><path d="M17 14v14l-4-3.5c-1.6-1.4-4 .6-2.6 2.4L17 36c1.6 2.4 3.6 4 6.6 4h5.8c4 0 6.6-3 6.6-7v-8c0-1.6-1.2-2.6-2.6-2.6S31 23.4 31 25v-2c0-1.6-1.2-2.6-2.6-2.6S26 21.4 26 23v-1c0-1.6-1.2-2.6-2.6-2.6S21 20.4 21 22v-8c0-1.4-.9-2.4-2-2.4S17 12.6 17 14z"/></svg>
        </div>
        <div id="ready-hint" class="ready-hint">Tap, click or press Space to fly</div>
      </div>
    </section>

    <section id="screen-pause" class="screen">
      <div class="panel">
        <h2 class="panel-title">Paused</h2>
        <button id="btn-resume" class="btn">Resume</button>
      </div>
    </section>

    <section id="screen-over" class="screen">
      <h2 class="over-title" data-text="Game Over">Game Over</h2>
      <div class="panel score-panel">
        <div id="new-best" class="badge">New Best!</div>
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span id="over-score" class="value">0</span></div>
          <div class="stat"><span class="label">Best</span><span id="over-best" class="value best">0</span></div>
        </div>
        <div id="over-tip" class="tip"></div>
      </div>
      <div class="over-actions">
        <button id="btn-home" class="icon-btn big" aria-label="Back to title" title="Title screen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 3.5 11.5h2.6V19h4.4v-4.6h3V19h4.4v-7.5h2.6z"/></svg>
        </button>
        <button id="btn-restart" class="btn btn-big">Restart</button>
      </div>
      <div class="restart-hint">or press Space</div>
    </section>
  </div>

  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
